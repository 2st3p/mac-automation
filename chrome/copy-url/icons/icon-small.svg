<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- The 16 and 32 pixel icon: the window and its named front tab, on whole pixels. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="16" height="16" rx="3.5" fill="url(#bg)" shape-rendering="geometricPrecision"/>
  <rect x="10" y="5" width="3" height="2" fill="#fff" opacity=".5"/>
  <rect x="3" y="4" width="6" height="3" fill="#fff"/>
  <rect x="2" y="7" width="12" height="6" fill="#fff"/>
  <rect x="4" y="5" width="4" height="1" fill="#4F6BF0"/>
  <rect x="4" y="9" width="6" height="1" fill="#C7D2FE"/>
</svg>
